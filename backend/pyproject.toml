[project]
name = "minify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divyanshu Shende", email = "divyanshu.shende@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
minify = "minify:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
